name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev,api]"
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Tests
        run: pytest

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build package
        run: |
          pip install build
          python -m build

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t credit-risk .
      - name: Train inside the image (downloads the UCI dataset)
        run: |
          mkdir -p models data/raw
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD/models:/app/models" -v "$PWD/data:/app/data" \
            credit-risk python -m credit_risk.train
      - name: Start the API
        run: |
          docker run -d --name api -p 8000:8000 --user "$(id -u):$(id -g)" \
            -v "$PWD/models:/app/models:ro" credit-risk
      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/health
          curl -fsS -X POST http://127.0.0.1:8000/predict \
            -H "Content-Type: application/json" -d @examples/applicant.json
      - name: Container logs on failure
        if: failure()
        run: docker logs api
